<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyLab Escape · Laboratorio de Python</title>
<meta name="description" content="Sala de escape gamificada para aprender Python: variables, condicionales, colecciones, bucles, funciones, clases, herencia y módulos.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Nunito+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B132B; --bg2:#0E1835; --panel:#1C2541; --panel2:#243056; --steel:#3A506B;
  --teal:#5BC0BE; --teal-d:#3E9C9A; --cream:#F4F1DE; --amber:#F2C57C; --coral:#E07A5F;
  --green:#7BD88F; --muted:#9FB3C8; --code:#070D1F; --line:#2E3B63;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-head:'Rubik',system-ui,sans-serif; --f-body:'Nunito Sans',system-ui,sans-serif; --f-code:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.6;min-height:100vh;
  background-image:radial-gradient(circle at 15% 0%, rgba(91,192,190,.10), transparent 40%),
  radial-gradient(circle at 100% 100%, rgba(58,80,107,.35), transparent 45%),
  linear-gradient(rgba(91,192,190,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(91,192,190,.035) 1px, transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.15;margin:0 0 .5em}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
code{font-family:var(--f-code);background:rgba(91,192,190,.12);color:var(--teal);padding:1px 6px;border-radius:6px;font-size:.9em}
.hidden{display:none!important}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;
  background:rgba(11,19,43,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--teal)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:800;font-size:22px;letter-spacing:.5px;cursor:pointer;margin-right:auto}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--teal);display:grid;place-items:center;font-size:22px;box-shadow:0 0 18px rgba(91,192,190,.5)}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700;white-space:nowrap}
.chip.xp{color:var(--amber)} .chip.py-ok{color:var(--green)} .chip.py-load{color:var(--amber)} .chip.py-off{color:var(--coral)}
.navbtn{background:transparent;border:1px solid var(--line);color:var(--cream);padding:7px 12px;border-radius:10px;font-size:14px;font-weight:700}
.navbtn:hover{border-color:var(--teal);color:var(--teal)}
.locks{display:flex;gap:4px}
.locks span{width:22px;height:26px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-code);font-size:13px;font-weight:700;color:var(--muted)}
.locks span.on{background:var(--teal);color:var(--bg);border-color:var(--teal)}

main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

/* ---------- GENERIC ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:12px;padding:12px 22px;font-weight:800;font-family:var(--f-head);font-size:16px;transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(1px)}
.btn-main{background:var(--teal);color:var(--bg);box-shadow:0 6px 0 var(--teal-d)}
.btn-main:hover{box-shadow:0 6px 0 var(--teal-d),0 0 22px rgba(91,192,190,.45)}
.btn-ghost{background:transparent;color:var(--cream);border:2px solid var(--steel)}
.btn-ghost:hover{border-color:var(--teal)}
.btn-amber{background:var(--amber);color:var(--bg);box-shadow:0 6px 0 #C79A4F}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eyebrow{font-family:var(--f-head);font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--teal);font-weight:700}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

/* ---------- INTRO ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;margin-bottom:28px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(36px,6vw,64px);font-weight:800}
.hero h1 span{color:var(--teal)}
.hero p.lead{font-size:20px;color:#D5E3EA}
.terminal{background:var(--code);border:2px solid var(--steel);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.terminal .bar{display:flex;gap:7px;padding:10px 14px;background:var(--panel)}
.terminal .bar i{width:12px;height:12px;border-radius:50%;display:block}
.terminal pre{margin:0;padding:18px;font-family:var(--f-code);font-size:14px;line-height:1.7;color:var(--cream);white-space:pre-wrap;min-height:230px}
.typed::after{content:"▋";animation:blink 1s steps(1) infinite;color:var(--teal)}
@keyframes blink{50%{opacity:0}}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
@media (max-width:820px){.rules{grid-template-columns:1fr 1fr}}
.rule{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:14px;padding:16px}
.rule:nth-child(2){border-top-color:var(--amber)} .rule:nth-child(3){border-top-color:var(--coral)} .rule:nth-child(4){border-top-color:var(--green)}
.rule b{display:block;font-family:var(--f-head);font-size:17px;margin:4px 0}
.rule .ic{font-size:26px}
.teamform{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.input{background:var(--code);border:2px solid var(--steel);color:var(--cream);border-radius:12px;padding:12px 16px;font-size:17px;font-family:var(--f-body);min-width:260px;flex:1}
.input:focus{outline:none;border-color:var(--teal)}
.avatars{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.avatars button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:26px}
.avatars button.sel{border-color:var(--teal);background:var(--panel2);box-shadow:0 0 14px rgba(91,192,190,.4)}

/* ---------- MAPA ---------- */
.mapa-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.pybot{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:14px;padding:14px 18px;margin-bottom:22px}
.pybot .face{font-size:38px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pybot p{margin:0}
.pybot b{color:var(--teal);font-family:var(--f-head)}
.salas{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:980px){.salas{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.salas{grid-template-columns:1fr}}
.sala{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;color:var(--cream);min-height:190px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.sala:hover:not(.locked){transform:translateY(-3px);border-color:var(--teal)}
.sala .num{font-family:var(--f-code);font-size:13px;color:var(--muted)}
.sala .ic{font-size:36px}
.sala h3{font-size:19px;margin:2px 0 0}
.sala .concepto{font-size:14px;color:var(--teal);font-weight:700}
.sala .estado{margin-top:auto;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sala .digit{font-family:var(--f-code);font-weight:700;font-size:22px;color:var(--bg);background:var(--teal);border-radius:8px;padding:0 9px}
.sala.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
.sala.locked::after{content:"🔒";position:absolute;top:14px;right:16px;font-size:22px}
.sala.done{border-color:var(--teal-d);background:linear-gradient(160deg,var(--panel) 60%,rgba(91,192,190,.15))}
.sala.current{border-color:var(--amber);box-shadow:0 0 0 4px rgba(242,197,124,.15)}
.progress{height:12px;background:var(--code);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress > div{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .5s}
.door-cta{margin-top:24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,var(--panel),var(--panel2));border:2px dashed var(--amber);border-radius:18px;padding:20px 24px}

/* ---------- SALA ---------- */
.sala-head{display:flex;gap:18px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.sala-head .big{font-size:56px}
.sala-head h2{font-size:clamp(26px,4vw,40px);margin:0}
.steps{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.step{flex:1;min-width:150px;border:2px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:10px 14px;font-weight:800;font-family:var(--f-head);text-align:left}
.step.active{border-color:var(--teal);color:var(--cream)}
.step.ok{color:var(--green)}
.step.ok::after{content:" ✔"}
.step:disabled{opacity:.5;cursor:not-allowed}
.lectura{font-size:18px}
.lectura h3{color:var(--teal);font-size:22px;margin-top:22px}
.lectura p{margin:.5em 0 .9em}
.lectura .tip{background:rgba(242,197,124,.1);border-left:4px solid var(--amber);border-radius:8px;padding:10px 14px;margin:14px 0}
.lectura .ojo{background:rgba(224,122,95,.12);border-left:4px solid var(--coral);border-radius:8px;padding:10px 14px;margin:14px 0}
.codebox{position:relative;background:var(--code);border:1px solid var(--steel);border-radius:12px;margin:12px 0 16px;overflow:hidden}
.codebox pre{margin:0;padding:16px 18px;font-family:var(--f-code);font-size:15px;line-height:1.65;overflow-x:auto;color:var(--cream)}
.codebox .run{position:absolute;top:10px;right:10px;background:var(--teal);color:var(--bg);border:none;border-radius:8px;padding:5px 12px;font-weight:800;font-size:13px}
.codebox .out{border-top:1px dashed var(--steel);padding:10px 18px;font-family:var(--f-code);font-size:14px;color:var(--green);white-space:pre-wrap;background:#050A18}
.codebox .out.err{color:var(--coral)}
.tk-k{color:#5BC0BE;font-weight:700} .tk-s{color:#F2C57C} .tk-c{color:#7F93AD;font-style:italic} .tk-n{color:#F5A97F} .tk-f{color:#8FB8F0} .tk-b{color:#C3A6F5}

/* ---------- PRÁCTICA ---------- */
.ejercicio{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.ejercicio .q{font-weight:700;font-size:18px;margin-bottom:10px}
.ejercicio .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--bg);background:var(--amber);border-radius:6px;padding:1px 8px;margin-bottom:8px}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.opciones{grid-template-columns:1fr}}
.opcion{text-align:left;background:var(--panel);color:var(--cream);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--f-code);font-size:15px;white-space:pre-wrap}
.opcion:hover:not(:disabled){border-color:var(--teal)}
.opcion.bien{border-color:var(--green);background:rgba(123,216,143,.12)}
.opcion.mal{border-color:var(--coral);background:rgba(224,122,95,.12);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:16px}
.feedback.bien{background:rgba(123,216,143,.12);border-left:4px solid var(--green)}
.feedback.mal{background:rgba(224,122,95,.12);border-left:4px solid var(--coral)}
.blank{background:#0B1530;border:none;border-bottom:2px solid var(--amber);color:var(--amber);font-family:var(--f-code);font-size:15px;width:9ch;text-align:center;padding:2px 4px}
.blank:focus{outline:none;border-bottom-color:var(--teal)}
.blank.bien{border-bottom-color:var(--green);color:var(--green)} .blank.mal{border-bottom-color:var(--coral);color:var(--coral)}
.parsons{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.parsons{grid-template-columns:1fr}}
.pzone{background:var(--code);border:2px dashed var(--steel);border-radius:12px;padding:10px;min-height:120px}
.pzone h4{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:2px 4px 8px}
.pline{display:block;width:100%;text-align:left;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-family:var(--f-code);font-size:14px;white-space:pre}
.pline:hover{border-color:var(--teal)}

/* ---------- DESAFÍO ---------- */
.mision{background:linear-gradient(135deg,var(--panel2),var(--panel));border:2px solid var(--amber);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.mision h3{color:var(--amber);margin-bottom:6px}
.editor-wrap{display:grid;grid-template-columns:44px 1fr;background:var(--code);border:2px solid var(--steel);border-radius:14px;overflow:hidden}
.editor-wrap:focus-within{border-color:var(--teal)}
.gutter{padding:14px 6px;text-align:right;font-family:var(--f-code);font-size:15px;line-height:1.6;color:#4F6283;background:#060B1A;user-select:none;white-space:pre}
.editor{width:100%;min-height:300px;resize:vertical;border:none;background:transparent;color:var(--cream);font-family:var(--f-code);font-size:15px;line-height:1.6;padding:14px;outline:none;white-space:pre;overflow:auto;tab-size:4}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.consola{background:#050A18;border:1px solid var(--steel);border-radius:12px;padding:14px 16px;font-family:var(--f-code);font-size:14px;white-space:pre-wrap;min-height:70px;color:var(--cream)}
.consola .ok{color:var(--green)} .consola .err{color:var(--coral)} .consola .info{color:var(--muted)}
.tests{list-style:none;padding:0;margin:12px 0}
.tests li{padding:8px 12px;border-radius:8px;margin-bottom:6px;background:var(--bg2);border-left:4px solid var(--steel);font-size:15px}
.tests li.pass{border-left-color:var(--green)} .tests li.fail{border-left-color:var(--coral)}
.pistas{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pista{background:rgba(242,197,124,.1);border:1px solid rgba(242,197,124,.4);border-radius:10px;padding:10px 14px;font-size:15px}

/* ---------- PUERTA ---------- */
.puerta{max-width:760px;margin:0 auto;text-align:center}
.keypad-digits{display:flex;justify-content:center;gap:10px;margin:22px 0;flex-wrap:wrap}
.keypad-digits input{width:58px;height:74px;text-align:center;font-family:var(--f-code);font-size:34px;font-weight:700;background:var(--code);color:var(--teal);border:3px solid var(--steel);border-radius:12px}
.keypad-digits input:focus{outline:none;border-color:var(--amber)}
.door{font-size:120px;line-height:1;margin:10px 0;transition:transform .6s}
.door.open{transform:scale(1.2) rotate(-8deg)}

/* ---------- MISIÓN FINAL ---------- */
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
@media (max-width:820px){.temas{grid-template-columns:1fr}}
.tema{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;color:var(--cream)}
.tema.sel{border-color:var(--teal);box-shadow:0 0 16px rgba(91,192,190,.3)}
.tema .ic{font-size:30px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--bg2);margin-bottom:8px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--teal);margin-top:2px;flex:none}
.tree{font-family:var(--f-code);font-size:14px;background:var(--code);border-radius:12px;padding:14px 18px;white-space:pre;overflow-x:auto;color:var(--cream)}

/* ---------- CERTIFICADO ---------- */
.cert{max-width:900px;margin:0 auto;background:var(--cream);color:var(--bg);border-radius:20px;padding:46px;border:10px double var(--steel);text-align:center;position:relative}
.cert h2{font-size:44px;color:var(--bg)}
.cert .team{font-family:var(--f-head);font-size:38px;font-weight:800;color:#23706E;margin:12px 0}
.cert .stats{display:flex;justify-content:center;gap:16px;margin:22px 0;flex-wrap:wrap}
.cert .stats div{background:#fff;border:2px solid #DDD8BE;border-radius:12px;padding:12px 20px;min-width:140px}
.cert .stats b{display:block;font-size:28px;font-family:var(--f-head)}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px;background:var(--panel);color:var(--cream);border:1px solid var(--line)}
.cert .badge{background:#0B132B;color:#F4F1DE}
.badge.off{opacity:.35}

/* ---------- MODAL / TOAST ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,24,.75);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:2px solid var(--teal);border-radius:18px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:26px;box-shadow:var(--shadow)}
.modal table{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}
.modal th,.modal td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.modal th{background:var(--bg);color:var(--teal)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--teal);color:var(--bg);font-weight:800;padding:12px 22px;border-radius:14px;z-index:120;transition:transform .35s;box-shadow:var(--shadow);font-family:var(--f-head);max-width:90vw;text-align:center}
.toast{opacity:0;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
@media (max-width:1440px){.navbtn .lbl{display:none}.brand small{display:none}}
@media (max-width:760px){.topbar{position:static;gap:8px;padding:8px 12px}.locks,#chip-team{display:none}.brand{font-size:18px}.chip{font-size:13px;padding:5px 10px}}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:110}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}

@media print{
  .topbar,footer,.noprint,#confeti,.toast{display:none!important}
  body{background:#fff}
  main{padding:0}
  .cert{border-color:#3A506B;box-shadow:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" onclick="irA('mapa')" title="Ir al mapa">
    <div class="logo">🤖</div>
    <div>PyLab Escape<small>Laboratorio de Python</small></div>
  </div>
  <span class="chip" id="chip-team">👥 —</span>
  <span class="chip xp" id="chip-xp">⭐ 0 XP</span>
  <span class="chip" id="chip-time">⏱ 00:00</span>
  <span class="chip py-off" id="chip-py" title="Estado del intérprete de Python">🐍 Python</span>
  <div class="locks" id="locks" title="Código de la puerta"></div>
  <button class="navbtn" onclick="irA('mapa')" title="Mapa">🗺<span class="lbl"> Mapa</span></button>
  <button class="navbtn" onclick="irA('mision')" title="Misión final">🏁<span class="lbl"> Misión final</span></button>
  <button class="navbtn" onclick="abrirDocente()" title="Panel docente">👩‍🏫<span class="lbl"> Docente</span></button>
  <button class="navbtn" id="btn-sonido" onclick="toggleSonido()" title="Sonido">🔊</button>
</header>

<main id="app"></main>

<footer>PyLab Escape · Secuencia didáctica de Programación avanzada con Python (INET 2026) · Prof. Rafael Mamani · Ushuaia, Tierra del Fuego</footer>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<canvas id="confeti"></canvas>
<script>
/* =====================================================================
   PyLab Escape · CONTENIDO DE LAS SALAS
   Para adaptar la experiencia, editá solo este bloque.
   Cada sala: historia → lectura → práctica guiada → desafío (da un dígito)
   ===================================================================== */
const py = String.raw;

function traducirError(msg) {

function actualizarGutter() { const ed = $("#editor"), n = ed.value.split("\n").length; $("#gutter").textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n"); $("#gutter").style.minHeight = ed.offsetHeight + "px"; }
function teclaEditor(ev) {
  const ed = ev.target, ini = ed.selectionStart, fin = ed.selectionEnd, v = ed.value;
  if (ev.key === "Tab") {
    ev.preventDefault();
    if (ev.shiftKey) { const li = v.lastIndexOf("\n", ini - 1) + 1; if (v.slice(li, li + 4) === "    ") { ed.value = v.slice(0, li) + v.slice(li + 4); ed.selectionStart = ed.selectionEnd = Math.max(li, ini - 4); } }
    else { ed.value = v.slice(0, ini) + "    " + v.slice(fin); ed.selectionStart = ed.selectionEnd = ini + 4; }
    ed.dispatchEvent(new Event("input"));
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    const li = v.lastIndexOf("\n", ini - 1) + 1, linea = v.slice(li, ini);
    let sang = (linea.match(/^ */) || [""])[0];
    if (/:\s*$/.test(linea)) sang += "    ";
    ed.value = v.slice(0, ini) + "\n" + sang + v.slice(fin); ed.selectionStart = ed.selectionEnd = ini + 1 + sang.length;
    ed.dispatchEvent(new Event("input"));
  }
}

      <div class="tip" style="border-left:4px solid var(--amber);background:var(--bg2);border-radius:8px;padding:10px 14px"><b>POO bien aplicada</b><br><span class="muted">Clases con sentido, herencia real y una sobreescritura justificada.</span></div>
      <div class="tip" style="border-left:4px solid var(--coral);background:var(--bg2);border-radius:8px;padding:10px 14px"><b>Organización</b><br><span class="muted">Módulos separados por responsabilidad, nombres claros, comentarios.</span></div>
      <div class="tip" style="border-left:4px solid var(--green);background:var(--bg2);border-radius:8px;padding:10px 14px"><b>Comunicación</b><br><span class="muted">Pueden explicar su código y muestran el programa a la clase.</span></div>
    </div>
  </div>`;
}
function elegirTema(i) { S.tema = i; guardar(); sOk(); vistaMision(); }
function marcarCheck(i, v) {
  S.checklist[i] = v; guardar();
  if (S.checklist.filter(Boolean).length === CHECKLIST.length) { sWin(); confeti(); toast("🛠️ ¡Insignia Constructor desbloqueada!"); }
  vistaMision();
}
function descargar(nombre) {
  const blob = new Blob([PLANTILLAS[nombre]], { type: "text/x-python" }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------------- INSIGNIAS Y CERTIFICADO ---------------- */
function insignias() {
  return [
    { ic: "🏆", t: "Escapista", ok: S.puerta },
    { ic: "🎯", t: "Puntería", ok: S.aciertosPrimera >= 15, d: "15 ejercicios al primer intento" },
    { ic: "🧠", t: "Sin pistas", ok: S.puerta && S.pistasTotales === 0 },
    { ic: "🧪", t: "Experimentador", ok: S.ejecutados >= 15, d: "15 ejecuciones" },
    { ic: "⚡", t: "Velocista", ok: S.puerta && S.puertaTiempo > 0 && S.puertaTiempo < 3 * 3600, d: "Escapar en menos de 3 h" },
    { ic: "🛠️", t: "Constructor", ok: S.checklist.filter(Boolean).length === CHECKLIST.length }
  ];
}
function vistaCert() {
  if (!S.puerta) { toast("El certificado aparece al abrir la puerta 🔒"); irA("mapa"); return; }
  const f = new Date().toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
  app().innerHTML = `<div class="cert">
    <div style="font-size:54px">${S.avatar}🤖</div><p class="eyebrow" style="color:#23706E">Certificado de escape</p>
    <h2>PyLab Escape · Laboratorio de Python</h2><p>Se certifica que el equipo</p><div class="team">${esc(S.team)}</div>
    <p>reprogramó a PyBot y escapó del Laboratorio de Robótica dominando variables, condicionales, colecciones, bucles, funciones, clases, herencia y módulos.</p>
    <div class="stats"><div><b>${S.xp}</b>XP</div><div><b>${fmtTiempo(S.puertaTiempo || S.elapsed)}</b>tiempo de misión</div><div><b>${S.pistasTotales}</b>pistas usadas</div></div>
    <div class="badges">${insignias().map(b => `<span class="badge ${b.ok ? "" : "off"}" title="${b.d || ""}">${b.ic} ${b.t}</span>`).join("")}</div>
    <p style="margin-top:26px;color:#3A506B">${f} · Ushuaia, Tierra del Fuego</p>
  </div>
  <div class="toolbar noprint" style="justify-content:center"><button class="btn btn-main" onclick="print()">🖨 Imprimir / Guardar PDF</button><button class="btn btn-ghost" onclick="irA('mision')">🏁 Misión final</button></div>`;
}

/* ---------------- VISTA: LECTURAS PREVIAS ---------------- */
function vistaLecturas() {
  app().innerHTML = `<div class="toolbar noprint"><button class="btn btn-ghost" onclick="irA(S.team ? 'mapa' : 'intro')">← Volver</button><button class="btn btn-main" onclick="print()">🖨 Imprimir lecturas</button></div>
    <h2 style="font-size:38px">📖 Lecturas previas</h2><p class="muted">Material para leer antes de cada clase. En el juego, cada ejemplo se puede ejecutar.</p>
    ${SALAS.map(s => `<div class="card lectura" style="margin-bottom:20px"><p class="eyebrow">Sala ${s.id} · ${s.concepto}</p><h2>${s.icono} ${s.titulo}</h2>${renderLectura(s, false)}</div>`).join("")}`;
}

/* ---------------- MODAL Y PANEL DOCENTE ---------------- */
function modal(html) { $("#modal-root").innerHTML = `<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">${html}</div></div>`; }
function cerrarModal() { $("#modal-root").innerHTML = ""; }
function abrirDocente() {
  const resumen = SALAS.map(s => { const st = S.salas[s.id]; return `<tr><td>${s.icono} ${s.id}. ${s.titulo}</td><td>${st.lectura ? "✔" : "—"}</td><td>${s.practica.filter((_, i) => st.practica[i]).length}/3</td><td>${st.desafio ? "✔ (" + st.intentos + " int.)" : st.intentos ? st.intentos + " int." : "—"}</td><td>${st.pistas}</td></tr>`; }).join("");
  modal(`<h2>👩‍🏫 Panel docente</h2>
    <p class="muted">La experiencia acompaña una secuencia de 4 clases. Las lecturas pueden asignarse como tarea (aula invertida).</p>
    <table><tr><th>Clase</th><th>Foco</th><th>Qué se hace</th><th>Logro</th></tr>${SECUENCIA.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table>
    <h3>Progreso de ${esc(S.team || "—")}</h3>
    <table><tr><th>Sala</th><th>Lectura</th><th>Práctica</th><th>Desafío</th><th>Pistas</th></tr>${resumen}</table>
    <p>XP: <b>${S.xp}</b> · Tiempo: <b>${fmtTiempo(S.elapsed)}</b> · Ejecuciones: <b>${S.ejecutados}</b> · Código de la puerta: <code>${CODIGO_FINAL}</code></p>
    <div class="toolbar">
      <button class="btn btn-main" onclick="copiarProgreso()">📋 Copiar informe</button>
      <button class="btn btn-ghost" onclick="cerrarModal();irA('lecturas')">📖 Lecturas previas</button>
      <button class="btn btn-ghost" onclick="toggleSoluciones()">${S.verSoluciones ? "🙈 Ocultar soluciones" : "👁 Mostrar soluciones"}</button>
      <button class="btn btn-ghost" onclick="desbloquearTodo()">${S.todoDesbloqueado ? "🔒 Volver a bloquear" : "🔓 Desbloquear salas (demo)"}</button>
      <button class="btn btn-ghost" style="border-color:var(--coral)" onclick="nuevoEquipo();cerrarModal()">🗑 Reiniciar</button>
      <button class="btn btn-ghost" onclick="cerrarModal()">Cerrar</button>
    </div>
    <p class="muted" style="font-size:13px">El progreso se guarda solo en este navegador. Para registrar la evaluación, usá “Copiar informe” y pegalo en tu planilla o en el aula virtual.</p>`);
}
function copiarProgreso() {
  const lineas = [`PyLab Escape · Informe del equipo ${S.team}`, `Fecha: ${new Date().toLocaleString("es-AR")}`, `XP: ${S.xp} | Tiempo: ${fmtTiempo(S.elapsed)} | Pistas: ${S.pistasTotales} | Puerta: ${S.puerta ? "abierta" : "cerrada"}`]
    .concat(SALAS.map(s => { const st = S.salas[s.id]; return `Sala ${s.id} (${s.concepto}): lectura ${st.lectura ? "sí" : "no"}, práctica ${s.practica.filter((_, i) => st.practica[i]).length}/3, desafío ${st.desafio ? "superado" : "pendiente"} en ${st.intentos} intento(s), pistas ${st.pistas}`; }))
    .concat([`Misión final: tema ${S.tema !== null ? TEMAS[S.tema].t : "sin elegir"}, checklist ${S.checklist.filter(Boolean).length}/${CHECKLIST.length}`, `Insignias: ${insignias().filter(b => b.ok).map(b => b.t).join(", ") || "ninguna"}`]);
  const txt = lineas.join("\n");
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("📋 Informe copiado")).catch(() => modal(`<h3>Informe</h3><textarea class="editor" style="min-height:260px;background:var(--code)">${esc(txt)}</textarea><button class="btn btn-main" onclick="cerrarModal()">Cerrar</button>`));
}
function toggleSoluciones() {
  if (!S.verSoluciones && !confirm("¿Mostrar el botón de soluciones en los desafíos? Recomendado solo para el docente.")) return;
  S.verSoluciones = !S.verSoluciones; guardar(); cerrarModal(); irA(vista, salaActual);
}
function desbloquearTodo() { S.todoDesbloqueado = !S.todoDesbloqueado; guardar(); cerrarModal(); irA(S.team ? "mapa" : "intro"); }

/* ---------------- INICIO ---------------- */
(function iniciar() {
  pintarBarra();
  const h = (location.hash || "").slice(1);
  if (h === "lecturas") irA("lecturas");
  else if (S.team) { const m = h.match(/^sala-(\d)$/); m ? irA("sala", Number(m[1])) : irA(["mapa", "mision", "cert", "puerta"].includes(h) ? h : "mapa"); }
  else irA("intro");
  document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });
})();
</script>
</body>
</html>
